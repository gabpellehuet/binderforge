# ==============================================================================
# BinderForge — run configuration  (design PARAMETERS only)
# ==============================================================================
# Machine paths + conda env names live in site.yaml, not here. Identity, target,
# and outputs are derived from the folder layout. Full reference: manual.md.
# Edit the `# TODO` lines; every other key has a sensible default.
# ==============================================================================

backbone_generator: "rfdiffusion"   # TODO  rfdiffusion | complexa
predictor:          "alphafast"     # TODO  alphafast | boltz

# ── Step 1 · Backbone — edit the block matching backbone_generator ────────────
step1_rfd:                          # rfdiffusion
  binder_length:    [50, 150]       # TODO  [min, max] residues
  target_residues:  ""              # TODO  target chain range, e.g. "A1-346"
  hotspot_residues: []              # TODO  e.g. ["A271","A244"]   ([] = whole surface)
  is_non_loopy:     true            # compact binders (recommended for PPI)
  batch_size:       2               # designs per batch per GPU
  num_batches:      100             # total = batch_size × num_batches × nGPUs
  step_scale:       1.5             # higher = tighter PPI, less diversity
  gamma_0:          0.6             # lower  = tighter PPI, less diversity

step1_complexa:                     # complexa
  target_input:     ""              # TODO  interface residue range, e.g. "A1-346"
  binder_length:    [50, 100]       # TODO  [min, max] residues
  hotspot_residues: []              # TODO  ([] = whole surface)
  nsteps:           200             # diffusion steps (300 = higher quality, slower)
  nsamples:         50              # designs per GPU
  batch_size:       4               # samples per forward pass (lower if CUDA OOM)
  algorithm:        "best-of-n"     # single-pass | best-of-n
  best_of_n_replicas: 10
  reward_model:     "af2"           # null | bioinformatics | af2
  refinement:       false
  n_recycle:        1
  seed:             5

# ── Step 2 · Sequence design (ProteinMPNN; auto-skipped for complexa) ─────────
step2_mpnn:
  seqs_per_target:  1000
  seqs_to_validate: 1               # top-N sequences forwarded to prediction
  sampling_temp:    0.1             # higher = more diversity
  batch_size:       24              # auto-snapped to a divisor of seqs_per_target

# ── Step 3 · Prediction — edit the block matching predictor ───────────────────
step3_boltz:
  recycling: 5
  samples:   1
step3_alphafast:
  num_gpus:  2

# ── Step 4 · Scoring  (advanced; omit any key to use the built-in default) ────
cutoffs:                            # dashboard selection
  rmsd:  1
  dsasa: 1500
scoring:
  refold_top_n: 10                  # top PASS designs refolded as monomers (0 = off)
  hard_eliminators:                 # [op, threshold]  op: gt|lt|eq — any hit eliminates
    lrmsd:               [gt, 3.73]
    sc_score:            [lt, 0.62]
    iptm:                [lt, 0.60]
    dSASA:               [lt, 800.0]
    clashes:             [gt, 5]
    af3_has_clash:       [eq, true]
    af3_frac_disordered: [gt, 0.30]
  ipsae_min_hard_cutoff: 0.30
  ipae_hard_cutoff:      20.0
  score_weights:                    # BinderScore composite (sum = 1.0)
    ipsae_min:        0.60
    dG_dSASA:         0.25
    sc_score:         0.08
    unsat_pen:        0.05
    model_confidence: 0.02
  tier1_cutoff: 0.75
  tier2_cutoff: 0.60
  soft_warnings:                    # flagged, never eliminated
    unsat_hbonds: [gt, 3]
    rmsd_binder:  [gt, 1.5]
    dG:           [gt, 0.0]
